openapi: 3.1.0
info:
  title: Project API
  version: 0.1.0
  description: >
    Single source of truth. Edited only by the Architect.
    Changes require a Contract Change Request and a CHANGELOG.md entry.
servers:
  - url: https://staging.example.com
    description: Staging
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "500":
          $ref: "#/components/responses/Error"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
